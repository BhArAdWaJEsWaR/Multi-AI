<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Assistant</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">LOCAL MULTI-AGENT ASSISTANT</p>
        <h1>Chat</h1>
      </div>
      <span id="status" class="status"><i></i> Connecting</span>
    </header>

    <section id="messages" class="messages" aria-live="polite">
      <div class="welcome">
        <div class="welcome-mark">✦</div>
        <h2>How can I help?</h2>
        <p>Ask a question, request code, explain an image path, or continue the current conversation.</p>
      </div>
    </section>

    <form id="chat-form" class="composer">
      <textarea id="message" rows="1" placeholder="Message your local assistant..." autocomplete="off"></textarea>
      <div class="composer-footer">
        <span class="hint">Enter to send · Shift+Enter for a new line</span>
        <button id="send" type="submit">Send <span>↵</span></button>
      </div>
    </form>
    <p class="footer-note">Runs locally through your existing orchestrator and Ollama models.</p>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
